name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.1.4 · Unmistakable Mute States & the 5 ms Exclusive Floor

            ### Fixed in v1.1.4
            - **A muted input no longer looks "engaged"** — the channel MUTE pill used to glow cyan (the console's "active" colour) when muted. Muted is now unmissable: solid red pill with speaker-X icon, diagonal red-tape stripes, steady breathing glow, a red MUTED badge in the column header, an INPUT MUTED readout, a red routing seam, and a dimmed preamp/fader so the whole channel reads as dead. ACTIVE stays green, OPEN SLOT stays gray.
            - **The channel strip and tab rail tell the same story** — latching red MUTE key with stripes, red-tinted channel header with pulsing speaker-X, dead-dark super fader, and a red strike-through across the muted channel's tab.
            - **MUTE ALL and BYPASS DSP are now persistent latching switches** — constant labels (no more text swaps), hardware state LEDs, zero layout shift, calm breathing glow when engaged. Every master-mute control in the app (top bar, preview dock, right panel, DSP module) behaves identically, and every state toggle is a proper switch for screen readers (aria-pressed).

            ### Changed in v1.1.4
            - **Exclusive-mode latency floor 10 ms → 5 ms** — the WASAPI period ladder now tries a 5 ms period first on pro DACs (halving exclusive latency where supported), falling back automatically to 10/20 ms.
            - **Final zero-latency audit** — every remaining millisecond is now documented and verified at its floor; the full stage-by-stage ledger lives in the engine docs.

            ### Added in v1.1.4
            - **docs/AUDIO-LATENCY.md** — a user guide to the latency table, the floor for every path, how to reach it (exclusive mode, zero alignment delays), and how to judge sync correctly (clap-and-listen, not video lips).

            ### Also in this release (v1.1.0–v1.1.3)
            - Deep latency pass (adaptive ≈5 ms shared target, 10 ms exclusive period, 2.7 ms raw tap), true one-button whole-DSP bypass, >8-channel discrete jack routing, exclusive WASAPI per-jack output, phone companion live-sync, Android companion APK, update dialog with live speed/ETA + Download-in-Browser fast path, persistent latched feedback-ring indicator, zero-default alignment delays, adaptive loopback cushion, crash containment — every v1.0.1–v1.1.3 fix included; installed apps auto-update to this release.
          releaseDraft: false
          prerelease: false

      - name: Attach Android companion APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "public/downloads/HKM-FOH-Companion.apk#HKM FOH Companion (Android APK)" --clobber
