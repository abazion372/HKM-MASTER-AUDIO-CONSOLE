name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.1.3 · Persistent Ring Indicator, Zero-Default Delays & Crash Containment

            ### Fixed in v1.1.3
            - **The red RING badge no longer pops on/off** — a confirmed feedback ring now latches for 8 seconds (steady, readable, keeps its frequency), severity escalates CLEAR → WATCH → RING with smooth color transitions, and every badge site is a persistent slot. No more strobing or flicker.
            - **100% input/output sync out of the box** — zone/crossover alignment delays no longer ship pre-applied (sub 4.5 ms, high 0.8 ms, rear 48.1 ms, foyer 64.1 ms defaults all → 0). Alignment delay is strictly opt-in per zone. These hidden defaults were the bulk of the remaining milliseconds.
            - **Adaptive loopback cushion** — starts at 10 ms, decays toward a 4 ms floor on healthy feeds, self-heals upward on jittery machines; surge ceiling 50 → 25 ms.

            ### Added in v1.1.3
            - **Crash containment** — a fault in any console module now shows a recovery card instead of a dead white screen; one-click reload restores the full mix from the persisted session, with copy-diagnostics for support.

            ### Also in this release (v1.1.0–v1.1.2)
            - Deep latency pass (adaptive ≈5 ms shared endpoint target, 10 ms exclusive period, 2.7 ms raw tap), true one-button whole-DSP bypass, >8-channel discrete jack routing, real jack metadata, exclusive WASAPI per-jack output, phone companion live-sync, Android HKM FOH Companion APK, update dialog with live speed/ETA + Download-in-Browser fast path — every v1.0.1–v1.0.4 fix included; installed apps auto-update to this release.
          releaseDraft: false
          prerelease: false

      - name: Attach Android companion APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "public/downloads/HKM-FOH-Companion.apk#HKM FOH Companion (Android APK)" --clobber
