name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.1.1 · Zero Unintended Latency & True Whole-DSP Bypass

            System audio is now in tight sync with the source everywhere — the only delay left in the signal path is delay you configure on purpose (zone alignment / user delayMs).

            ### Fixed in v1.1.1
            - **End-to-end system audio latency eliminated** — a full audit of the capture → DSP → render chain removed every buffer that silently added latency by default:
              - Shared raw output: the 200 ms permanently-full endpoint buffer is now a 40 ms buffer that drains to a 10 ms watermark (blocks no longer sit ~200 ms before the DAC).
              - Drift correction added to both WASAPI render pumps — producer/consumer clock mismatch can no longer accumulate a persistent backlog (was up to 1 s); the PCM queue is now 16-deep drop-on-full.
              - Exclusive WASAPI period 30 ms → 20 ms; capture pump poll 8 ms → 2 ms.
              - Web Audio `latencyHint` `'balanced'` → `'interactive'` (balanced silently added 20–50 ms of graph latency); loopback worklet surge ceiling 80 ms → 50 ms.
            - Jack probe audit message now reports true multi-channel card counts.

            ### Added in v1.1.1
            - **True one-button whole-DSP bypass (footer BYPASS DSP)** — bypass used to only neutralize parameters, so audio still flowed through every biquad and compressor (~6 ms lookahead each). It now rewires the console into a genuine zero-processing pass-through while gain, polarity, pan, faders, mute/solo, zone delays and routing keep working. Amber state + TOTAL SIGNAL BYPASS banner + RESTORE DSP.

            ### Also in this release (from v1.1.0)
            - >8-channel discrete jack routing (Dante / MADI / pro PCIe cards, up to 32 channels), real jack metadata from the Windows Device Topology API, exclusive WASAPI per-jack output, phone companion live-sync, and the Android HKM FOH Companion APK — every v1.0.1–v1.0.4 fix included.
            - In-app updater repaired (previous releases' `latest.json` carried a UTF-8 BOM the updater cannot parse); installed v1.0.x/v1.1.0 apps will auto-update to this release.
          releaseDraft: false
          prerelease: false

      - name: Attach Android companion APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "public/downloads/HKM-FOH-Companion.apk#HKM FOH Companion (Android APK)" --clobber
