name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.1.2 · Deep Latency Pass & Fast-Browser Update Path

            Second latency pass on top of v1.1.1: every remaining controllable millisecond in the live chain is now at its floor — system audio tracks the source as tightly as Windows physically allows.

            ### Fixed in v1.1.2
            - **Shared raw output no longer sits ~40 ms before the DAC** — an adaptive writer holds the endpoint at a ≈5 ms padding target (growing in 5 ms steps only when your machine proves it needs more headroom), the startup prefill no longer queues the first block behind a full silent buffer, and the backlog anchor tightened to a 2 ms watermark.
            - **Exclusive WASAPI period 20 ms → 10 ms** with automatic device fallbacks (20 ms f32 / 10 ms PCM16 / 20 ms PCM16) so arming never fails on period pickiness; queued backlog anchored at half a period (≈5 ms).
            - **Raw output tap batching 10 ms → 2.7 ms** (one render quantum per post).
            - Net: output-side controllable latency ~50–90 ms → ~8–15 ms worst case (≈8 ms typical). What remains is structural — the Windows engine's 10 ms packet cadence and the source app's own output latency — which no downstream app can remove.

            ### Added in v1.1.2
            - **Update dialog: live download speed / ETA / MB progress.**
            - **"Download in Browser (fast)"** — on networks where the in-app downloader is throttled, the dialog detects the slow transfer and offers the browser path (usually full-speed on the same network). Also available any time via the Browser button.

            ### Also in this release (from v1.1.0/v1.1.1)
            - True one-button whole-DSP bypass (footer BYPASS DSP) with genuine zero-processing pass-through; >8-channel discrete jack routing (Dante / MADI / pro PCIe cards); real jack metadata from the Windows Device Topology API; exclusive WASAPI per-jack output; phone companion live-sync; Android HKM FOH Companion APK — every v1.0.1–v1.0.4 fix included, in-app updater repaired (installed v1.0.x+ apps auto-update to this release).
          releaseDraft: false
          prerelease: false

      - name: Attach Android companion APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "public/downloads/HKM-FOH-Companion.apk#HKM FOH Companion (Android APK)" --clobber
