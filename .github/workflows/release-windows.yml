name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.1.0 · N-Channel Jacks, Native Jack Metadata, Companion Live-Sync & Android App

            Superset of v1.0.4 — every v1.0.1–v1.0.4 fix included, plus:

            ### New in v1.1.0
            - **>8-channel discrete jack routing (Dante / MADI / pro PCIe cards)** — probe cap lifted to 32 channels; cards beyond 7.1 expose the 4 named HDA jacks plus generated AUX n L/R pairs (teal/violet), manual-assign only. Layout badges show 10-CH / 16-CH etc.
            - **Real jack metadata (IKsJackDescription)** — the Rust shell reads physical jack colour / connector / panel from the Windows Device Topology API, and the Discrete Jack Bay shows the card's actual silkscreen colours.
            - **Exclusive WASAPI per-jack output (v2 native engine)** — bit-perfect per-jack delivery in AUDCLNT_SHAREMODE_EXCLUSIVE with event-driven streams and 16-bit PCM fallback; N-channel WAVEFORMATEXTENSIBLE support.
            - **Phone companion live-sync** — speaker-zone level/mute/jack changes made on the phone apply to the desktop in real time (zone:patch over the WebSocket relay) with permission enforcement.
            - **Android companion app — HKM FOH Companion** — real installable APK (Capacitor 7): pair with the desktop console, then run the PA from your phone anywhere on the LAN. APK attached to this release; PWA also supported.

            ### Fixed
            - **In-app updater repaired** — previous releases' `latest.json` carried a UTF-8 BOM that the updater cannot parse, so installed apps never saw updates. Manifests are now pipeline-generated clean JSON; installed v1.0.x apps will auto-update to this release.
            - Desktop→companion live sync never fired (relay `/internal/*` bodies were never awaited).
            - Jack probe audit message now reports true multi-channel card counts.
          releaseDraft: false
          prerelease: false

      - name: Attach Android companion APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "public/downloads/HKM-FOH-Companion.apk#HKM FOH Companion (Android APK)" --clobber
