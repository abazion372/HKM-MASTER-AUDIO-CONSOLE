name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (e.g. v0.2.35) when triggered manually'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows x64 NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install

      - name: Fetch bundled Bun server runtime (hkm-server.exe)
        run: npm run desktop:fetch-server

      - name: Build Next.js standalone server & prepare desktop bundle
        run: npm run build

      - name: Build Tauri Windows NSIS Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HKM Audio System ${{ github.ref_name }}'
          releaseBody: |
            ## HKM Audio System — v1.0.0 · First Verified Stable Release

            Full code-quality, crash-risk and 24/7-resource audit passed: strict TypeScript + lint clean, browser-verified zero console errors, near-zero idle load. This is the verified stable baseline for always-on church consoles.

            ### New in v1.0.0
            - **Guitar FX Rack — real-world pedalboard per input**: 12 stompbox slots in canonical chain order (Gate → Wah → Octaver → Comp → Overdrive → Distortion → Phaser → Chorus → Flanger → Tremolo → Delay → Reverb) with real-world archetypes (Tube Screamer/Klon, Phase 90, CH-1, DD-8 dotted-eighth with tap tempo, POG octaver, NS-2 gate, RV-6 reverbs). Engage any pedal on any channel from its input strip; zero audio-thread cost when off.
            - **Discrete 5.1/7.1 jack routing** — REAR/FRONT/CENTER/SIDE ports of PCIe & onboard cards as separate outputs per speaker zone.
            - **Real instrument inputs (MIC/LINE/INST Hi-Z)** with 48V interlocks, plus the tab-driven super input strip.

            ### Install & update reliability (fixes)
            - **Installer no longer fails on `hkm-server.exe`** (file lock during update) — the installer closes the app + sidecar before extracting files.
            - **The server no longer asks for microphone permission on each install** — the mic permission is granted natively and the console always binds the same origin.
            - Single-instance guard, orphaned sidecar cleanup, no more placeholder file in the install log.
            - 24/7 resource fixes: recorder memory/mic leaks, OBS overnight reconnect, hidden-window polling, WS backoff, zero store I/O per telemetry frame.

            ### Stable platform
            - **Self-Contained Windows x64 NSIS Installer** with embedded Next.js standalone control plane & bundled server runtime.
            - **Signed In-App Silent Updates** (`latest.json` + minisign signatures) — installed apps update themselves.
            - 16-Channel Virtual Console, WASAPI Process-Exclusion Loopback, per-app capture & source isolation, feedback/hum analysis, 31-band GEQ, active crossover, room acoustics DSP, remote companion.
          releaseDraft: false
          prerelease: false
