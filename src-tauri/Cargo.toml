[package]
name = "hkm-audio-system"
version = "1.2.0"
description = "HKM Audio System — Church Audio Intelligence & DSP Console"
authors = ["HKM Audio Systems"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "hkm_audio_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# MUST be registered as the FIRST plugin in lib.rs (see single-instance docs).
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
# Localhost-only HTTP bridge for desktop_api_request — no TLS features needed.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
